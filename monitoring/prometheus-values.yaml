# Helm values for kube-prometheus-stack
# Install with:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm install monitoring prometheus-community/kube-prometheus-stack \
#     -f monitoring/prometheus-values.yaml \
#     --namespace monitoring --create-namespace

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "slack-notifications"
      routes:
        - match:
            severity: critical
          receiver: "slack-notifications"
    receivers:
      - name: "slack-notifications"
        slack_configs:
          - api_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
            channel: "#alerts"
            send_resolved: true
            title: '{{ template "slack.default.title" . }}'
            text: '{{ template "slack.default.text" . }}'

prometheus:
  enabled: true
  prometheusSpec:
    # Scrape interval
    scrapeInterval: 30s
    evaluationInterval: 30s

additionalPrometheusRulesMap:
  flask-app-rules:
    groups:
      - name: flask.rules
        rules:
          - alert: PodFrequentlyRestarting
            expr: |
              increase(kube_pod_container_status_restarts_total{
                namespace="default",
                pod=~"flask-deployment-.*"
              }[1h]) > 3
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Flask pod is restarting frequently"
              description: >
                Pod {{ $labels.pod }} has restarted
                {{ $value | humanize }} times in the last hour.

          - alert: FlaskPodNotReady
            expr: |
              kube_pod_status_ready{
                namespace="default",
                pod=~"flask-deployment-.*",
                condition="true"
              } == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Flask pod is not ready"
              description: "Pod {{ $labels.pod }} has been unready for more than 5 minutes."

grafana:
  enabled: true
  adminPassword: "admin"

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
